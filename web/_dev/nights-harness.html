<!doctype html>
<!-- Pagina di prova della schermata Notti. Non fa parte dell'interfaccia di produzione.
     Uso:  /_dev/nights-harness.html?theme=night|day|red&lang=it|en
     Carica i CSS esistenti e nights.css, usa il loader reale di i18n.js (con i file nights)
     e instrada solo #/nights, con lo stesso ciclo unmount/mount di app.js. -->
<html lang="it" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:,">
  <title>Prova Notti</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/nights.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Vai al contenuto</a>

  <div class="shell">
    <nav class="nav" aria-label="Sezioni" data-i18n-aria="nav.label">
      <ul class="nav-list">
        <li><a class="nav-link" href="#/live" data-route="live"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="11" r="7"/><path d="M3 18h18"/></svg><span data-i18n="nav.live">Live</span></a></li>
        <li><a class="nav-link" href="#/nights" data-route="nights"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 14.6A7.6 7.6 0 0 1 9.4 4.5a7.6 7.6 0 1 0 10.1 10.1z"/></svg><span data-i18n="nav.nights">Notti</span></a></li>
        <li><a class="nav-link" href="#/color" data-route="color"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="9" cy="9.5" r="4.5"/><circle cx="15" cy="9.5" r="4.5"/><circle cx="12" cy="14.5" r="4.5"/></svg><span data-i18n="nav.color">Colore</span></a></li>
        <li><a class="nav-link" href="#/camera" data-route="camera"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 8.5h3.2L8.5 6h7l1.8 2.5h3.2v10.5h-17z"/><circle cx="12" cy="13.5" r="3.4"/></svg><span data-i18n="nav.camera">Camera</span></a></li>
        <li><a class="nav-link" href="#/site" data-route="site"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21s-6.5-5.9-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 15.1 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.3"/></svg><span data-i18n="nav.site">Sito</span></a></li>
      </ul>
    </nav>

    <main id="main" class="main" tabindex="-1">
      <div id="view" class="view">
        <p class="loading muted" data-i18n="app.loading">Carico…</p>
      </div>
    </main>
  </div>

  <script type="module">
    import { loadLocale, applyI18n, t } from '/js/i18n.js';
    import { api } from '/js/api.js';

    const params = new URLSearchParams(location.search);
    const lang = params.get('lang') === 'en' ? 'en' : 'it';
    document.documentElement.dataset.theme = ['night', 'day', 'red'].includes(params.get('theme'))
      ? params.get('theme')
      : 'night';

    // Il loader di i18n.js legge i file con percorsi relativi (i18n/...). Da /_dev/ quei percorsi
    // puntano alla cartella sbagliata: qui li si riporta alla radice di web/, senza altro cambiamento.
    const realFetch = window.fetch.bind(window);
    window.fetch = (input, init) => {
      const url = typeof input === 'string' ? input : input.url;
      if (url.startsWith('i18n/')) return realFetch(`/${url}`, init);
      return realFetch(input, init);
    };

    await loadLocale(lang);
    applyI18n(document);
    document.title = `Prova Notti (${lang})`;

    const { mount } = await import('/js/views/nights.js');

    let config = null;
    try {
      config = await api.config();
    } catch {
      config = null;
    }
    const ctx = {
      config: config ?? { site: { timezone: 'Europe/Rome' }, language: lang },
      getStatus: () => null,
      on: () => () => {},
    };

    const view = document.getElementById('view');
    let current = null;

    async function render() {
      let name = location.hash.replace(/^#\/?/, '').split(/[?/]/)[0];
      if (!name) {
        history.replaceState(null, '', '#/nights');
        name = 'nights';
      }
      document.querySelectorAll('[data-route]').forEach((link) => {
        if (link.dataset.route === name) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      });
      current?.unmount?.();
      current = null;
      if (name !== 'nights') {
        view.innerHTML = `<p class="lede">Sezione non inclusa nella prova.</p>`;
        return;
      }
      view.replaceChildren();
      current = (await mount(view, ctx)) || null;
      view.querySelector('h1')?.focus({ preventScroll: true });
    }

    window.addEventListener('hashchange', render);
    await render();
    window.__harnessReady = true;
  </script>
</body>
</html>
