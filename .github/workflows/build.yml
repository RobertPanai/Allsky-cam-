name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test AllSky.sln -c Release --nologo
      - name: Publish (self-contained, win-x64)
        run: >
          dotnet publish src/AllSky.Tray/AllSky.Tray.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish
      - name: Zip
        run: Compress-Archive -Path publish/* -DestinationPath AllSky-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AllSky-win-x64
          path: AllSky-win-x64.zip
