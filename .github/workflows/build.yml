name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        id: test
        continue-on-error: true
        run: dotnet test AllSky.sln -c Release --nologo --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
      - name: Publish (self-contained, win-x64, cartella)
        run: >
          dotnet publish src/AllSky.Tray/AllSky.Tray.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=false
          -o publish/AllSkyBrain
      - name: Zip e checksum
        shell: pwsh
        run: |
          Compress-Archive -Path publish/AllSkyBrain/* -DestinationPath AllSkyBrain-win-x64.zip
          $h = (Get-FileHash AllSkyBrain-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  AllSkyBrain-win-x64.zip" | Out-File -Encoding ascii AllSkyBrain-win-x64.zip.sha256
          Write-Host "SHA256 $h"
      - uses: actions/upload-artifact@v4
        with:
          name: AllSkyBrain-win-x64
          path: |
            AllSkyBrain-win-x64.zip
            AllSkyBrain-win-x64.zip.sha256

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AllSkyBrain-win-x64
      - name: Aggiorna la Release "latest" con lo zip e il checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTE="Ultima build di AllSky Brain per Windows 10/11 x64 (generata da main ad ogni push). Non firmata: Windows e Chrome possono mostrare un avviso. Verifica il file con il SHA-256 nel file .sha256. Estrai lo zip e avvia AllSkyBrain.exe."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest AllSkyBrain-win-x64.zip AllSkyBrain-win-x64.zip.sha256 --clobber
            gh release edit latest --notes "$NOTE"
          else
            gh release create latest AllSkyBrain-win-x64.zip AllSkyBrain-win-x64.zip.sha256 \
              --prerelease --title "AllSky Brain - ultima build" --notes "$NOTE"
          fi
