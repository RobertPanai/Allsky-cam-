name: release-stable

# Release stabile con aggiornamento automatico (Velopack).
# Si attiva solo con un tag v<MAJOR>.<MINOR>.<PATCH>, es. v0.2.0.
# Il workflow build-windows resta invariato: pubblica il rolling "latest" a ogni push su main.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da rilasciare, es. 0.2.0 (crea il tag v<versione>)'
        required: true

permissions:
  contents: write

jobs:
  stable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Versione dal tag
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '${{ github.event.inputs.version }}' }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Versione non valida: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained win-x64
        run: >
          dotnet publish src/AllSky.Tray/AllSky.Tray.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=false -p:Version=${{ steps.ver.outputs.version }}
          -o publish/AllSkyBrain

      # vpk con la stessa versione del pacchetto Velopack in AllSky.Tray.csproj (1.2.161).
      - name: Installa vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Pacchetti Velopack
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN
          vpk pack --packId AllSkyBrain --packVersion ${{ steps.ver.outputs.version }} --packDir publish/AllSkyBrain --mainExe AllSkyBrain.exe --packTitle "AllSky Brain"
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN --publish --releaseName "AllSky Brain ${{ steps.ver.outputs.version }}" --tag "${{ steps.ver.outputs.tag }}"
